<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Resize Image - Fast Exact KB Compressor</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #000000;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .glow-text {
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
        }
        .glow-border {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }
        .neon-btn {
            background: linear-gradient(135deg, #00ffaa 0%, #00ffcc 100%);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
        }
        .neon-btn:hover {
            background: linear-gradient(135deg, #00df95 0%, #00dfb3 100%);
        }
    </style>
</head>
<body class="text-gray-300 flex items-center justify-center p-3 md:p-6 min-h-screen">

    <div class="w-full max-w-3xl bg-[#030303] border border-zinc-900 rounded-3xl p-5 md:p-8 shadow-2xl">
        
        <div class="text-center mb-8">
            <div class="inline-flex flex-col items-center justify-center gap-1">
                <div class="glow-text mb-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                        <path d="M12 2a8 8 0 0 0-8 8v12l3-2.5 3 2.5 3-2.5 3 2.5 3-2.5 3 2.5V10a8 8 0 0 0-8-8z" />
                        <circle cx="9" cy="10" r="1" fill="currentColor"/>
                        <circle cx="15" cy="10" r="1" fill="currentColor"/>
                        <path d="M12 14a1.5 1.5 0 0 1-1.5-1.5h3A1.5 1.5 0 0 1 12 14z" fill="currentColor"/>
                    </svg>
                </div>
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-wider uppercase glow-text font-mono">
                    Ghost Resize Image
                </h1>
            </div>
            <div class="flex items-center justify-center gap-2 mt-2 text-xs tracking-widest text-zinc-500 uppercase">
                <span class="text-[#00ffcc] text-[8px]">◆</span> Fast & Exact KB Image/PDF Compressor <span class="text-[#00ffcc] text-[8px]">◆</span>
            </div>
        </div>

        <div id="dropZone" class="border border-dashed border-zinc-800 bg-[#060606] rounded-2xl p-8 text-center cursor-pointer hover:border-[#00ffcc]/50 transition-all mb-6 group">
            <input type="file" id="fileInput" accept="image/jpeg, image/png, image/webp, application/pdf" class="hidden">
            <div class="flex flex-col items-center gap-3">
                <div class="text-[#00ffcc] opacity-80 group-hover:scale-110 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" /></svg>
                </div>
                <p class="text-base font-medium text-zinc-200">Drag & Drop Image or PDF Here</p>
                <button type="button" onclick="document.getElementById('fileInput').click()" class="bg-[#121212] border border-zinc-800 text-zinc-300 px-5 py-2 rounded-xl text-xs font-semibold hover:text-[#00ffcc] transition-all">
                    Choose File
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center mb-6">
            <div class="bg-[#050505] border border-zinc-900 rounded-xl p-4 text-center h-48 flex flex-col items-center justify-center relative">
                <span class="absolute top-3 left-3 text-[11px] text-zinc-400 uppercase">Original</span>
                <img id="origPreview" class="max-h-32 max-w-full rounded-lg hidden object-contain">
                <div id="origPDFIcon" class="hidden text-red-500 flex flex-col items-center"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg><p id="origPDFName" class="text-xs text-zinc-400 mt-1 max-w-[160px] truncate"></p></div>
                <div id="origPlaceholder" class="text-zinc-700"><p class="text-xs">No file selected</p></div>
            </div>

            <div class="bg-[#050505] border border-zinc-900 rounded-xl p-4 text-center h-48 flex flex-col items-center justify-center relative">
                <span class="absolute top-3 left-3 text-[11px] text-zinc-400 uppercase">Preview</span>
                <img id="destPreview" class="max-h-32 max-w-full rounded-lg hidden object-contain">
                <div id="destPDFIcon" class="hidden text-[#00ffcc] flex flex-col items-center"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/></svg><p class="text-xs text-zinc-400 mt-1">Processed PDF Ready</p></div>
                <div id="destPlaceholder" class="text-zinc-700"><p class="text-xs">No file processed</p></div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="bg-[#050505] border border-zinc-900 p-4 rounded-xl">
                <h3 class="text-xs font-bold text-[#00ffcc] uppercase mb-3">1. Dimensions (Optional)</h3>
                <div class="grid grid-cols-2 gap-3 mb-2">
                    <div>
                        <label class="block text-[10px] text-zinc-500 mb-1">Width (px)</label>
                        <input type="number" id="widthInput" class="w-full bg-[#0a0a0a] border border-zinc-800 rounded-lg px-3 py-2 text-xs text-zinc-200 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] text-zinc-500 mb-1">Height (px)</label>
                        <input type="number" id="heightInput" class="w-full bg-[#0a0a0a] border border-zinc-800 rounded-lg px-3 py-2 text-xs text-zinc-200 outline-none">
                    </div>
                </div>
                <label id="aspectRatioContainer" class="inline-flex items-center gap-2 text-[11px] text-zinc-400 cursor-pointer mt-1">
                    <input type="checkbox" id="aspectRatio" checked class="accent-[#00ffcc]"> Lock Aspect Ratio
                </label>
            </div>

            <div class="bg-[#050505] border border-zinc-900 p-4 rounded-xl">
                <h3 class="text-xs font-bold text-[#00ffcc] uppercase mb-3">2. Exact Target Size</h3>
                <div class="grid grid-cols-5 gap-2 mb-3">
                    <div class="col-span-2">
                        <label class="block text-[10px] text-zinc-500 mb-1">Type</label>
                        <select id="compressionType" class="w-full bg-[#0a0a0a] border border-zinc-800 rounded-lg px-2 py-2 text-xs text-zinc-300 outline-none"><option>Target Size</option></select>
                    </div>
                    <div class="col-span-3">
                        <label class="block text-[10px] text-zinc-500 mb-1">Enter Target Size</label>
                        <input type="number" id="targetSize" value="50" class="w-full bg-[#0a0a0a] border border-zinc-800 rounded-lg px-3 py-2 text-xs text-zinc-200 outline-none focus:border-[#00ffcc] glow-border">
                    </div>
                </div>
                <div class="flex items-center gap-4 text-xs text-zinc-400 mt-2">
                    <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="unit" value="KB" checked class="accent-[#00ffcc]"> KB</label>
                    <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="unit" value="MB" class="accent-[#00ffcc]"> MB</label>
                </div>
            </div>
        </div>

        <button id="processBtn" class="w-full neon-btn text-black font-bold py-3.5 px-4 rounded-xl text-sm tracking-wider uppercase cursor-pointer mb-6">
            Resize & Compress Instantly
        </button>

        <div class="bg-[#040404] border border-zinc-900 rounded-xl p-4 mb-6">
            <div class="grid grid-cols-3 gap-3 text-center mb-2">
                <div class="bg-[#080808] p-3 rounded-lg border border-zinc-900"><p class="text-[9px] text-zinc-500 uppercase mb-1">Original</p><span id="infoOrigSize" class="text-xs text-zinc-300">-</span></div>
                <div class="bg-[#080808] p-3 rounded-lg border border-zinc-900"><p class="text-[9px] text-zinc-500 uppercase mb-1">Final Size</p><span id="infoFinalSize" class="text-xs font-bold text-[#00ffcc]">-</span></div>
                <div class="bg-[#080808] p-3 rounded-lg border border-zinc-900"><p class="text-[9px] text-zinc-500 uppercase mb-1">Resolution</p><span id="infoResolution" class="text-xs text-zinc-300">-</span></div>
            </div>
        </div>

        <button id="downloadBtn" disabled class="w-full bg-transparent border border-zinc-900 text-zinc-600 font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 text-xs uppercase cursor-not-allowed">
            Download File
        </button>
    </div>

    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script>
        let isPDF = false, pdfArrayBuffer = null, originalImage = null;
        let originalFileName = 'ghost_asset', originalMimeType = '', originalAspectRatio = 1, processedBlob = null;

        const fileInput = document.getElementById('fileInput'), dropZone = document.getElementById('dropZone');
        const origPreview = document.getElementById('origPreview'), origPDFIcon = document.getElementById('origPDFIcon'), origPDFName = document.getElementById('origPDFName'), origPlaceholder = document.getElementById('origPlaceholder');
        const destPreview = document.getElementById('destPreview'), destPDFIcon = document.getElementById('destPDFIcon'), destPlaceholder = document.getElementById('destPlaceholder');
        const widthInput = document.getElementById('widthInput'), heightInput = document.getElementById('heightInput'), aspectRatioCheck = document.getElementById('aspectRatio'), aspectRatioContainer = document.getElementById('aspectRatioContainer');
        const targetSizeInput = document.getElementById('targetSize'), processBtn = document.getElementById('processBtn'), downloadBtn = document.getElementById('downloadBtn');
        const infoOrigSize = document.getElementById('infoOrigSize'), infoFinalSize = document.getElementById('infoFinalSize'), infoResolution = document.getElementById('infoResolution');

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#00ffcc'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = ''; });
        dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.style.borderColor = ''; if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', (e) => { if(e.target.files.length) handleFile(e.target.files[0]); });

        widthInput.addEventListener('input', () => { if (!isPDF && aspectRatioCheck.checked && originalImage && widthInput.value) heightInput.value = Math.round(widthInput.value / originalAspectRatio); });
        heightInput.addEventListener('input', () => { if (!isPDF && aspectRatioCheck.checked && originalImage && heightInput.value) widthInput.value = Math.round(heightInput.value * originalAspectRatio); });

        function handleFile(file) {
            originalFileName = file.name.split('.').slice(0, -1).join('.');
            infoOrigSize.textContent = formatBytes(file.size);
            clearState();

            if (file.type === "application/pdf" || file.name.endsWith('.pdf')) {
                isPDF = true;
                aspectRatioContainer.classList.add('hidden');
                widthInput.value = ""; heightInput.value = "";
                origPDFName.textContent = file.name;
                origPDFIcon.classList.remove('hidden'); origPlaceholder.classList.add('hidden');

                const r = new FileReader();
                r.onload = function(e) {
                    pdfArrayBuffer = e.target.result;
                    window.PDFLib.PDFDocument.load(pdfArrayBuffer).then(d => { infoResolution.textContent = d.getPageCount() + " Pages"; });
                };
                r.readAsArrayBuffer(file);
            } else {
                isPDF = false;
                originalMimeType = file.type;
                aspectRatioContainer.classList.remove('hidden');

                const r = new FileReader();
                r.onload = (e) => {
                    originalImage = new Image();
                    originalImage.onload = () => {
                        originalAspectRatio = originalImage.width / originalImage.height;
                        widthInput.value = originalImage.width; heightInput.value = originalImage.height;
                        infoResolution.textContent = `${originalImage.width} × ${originalImage.height}`;
                        origPreview.src = e.target.result;
                        origPreview.classList.remove('hidden'); origPlaceholder.classList.add('hidden');
                    };
                    originalImage.src = e.target.result;
                };
                r.readAsDataURL(file);
            }
        }

        function clearState() {
            origPreview.classList.add('hidden'); origPDFIcon.classList.add('hidden'); origPlaceholder.classList.remove('hidden');
            destPreview.classList.add('hidden'); destPDFIcon.classList.add('hidden'); destPlaceholder.classList.remove('hidden');
            downloadBtn.disabled = true;
            downloadBtn.className = "w-full bg-transparent border border-zinc-900 text-zinc-600 font-bold py-3 px-4 rounded-xl flex items-center justify-center text-xs uppercase cursor-not-allowed";
        }

        processBtn.addEventListener('click', async () => {
            processBtn.textContent = "Processing... Plz Wait";
            processBtn.disabled = true;
            setTimeout(async () => {
                if (isPDF && pdfArrayBuffer) await fastCompressPDF();
                else if (!isPDF && originalImage) fastCompressImage();
                else { alert("Upload file first."); resetBtn(); }
            }, 50);
        });

        function resetBtn() {
            processBtn.textContent = "Resize & Compress Instantly";
            processBtn.disabled = false;
        }

        // ⚡ FAST SUPER LIGHT IMAGE COMPRESSION (Max 7 Steps Loop)
        function fastCompressImage() {
            let w = parseInt(widthInput.value) || originalImage.width;
            let h = parseInt(heightInput.value) || originalImage.height;
            const unit = document.querySelector('input[name="unit"]:checked').value;
            let targetBytes = (parseFloat(targetSizeInput.value) || 50) * 1024;
            if (unit === 'MB') targetBytes *= 1024;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            let qMin = 0.02, qMax = 0.98, bestBlob = null, steps = 0;

            function step() {
                canvas.width = w; canvas.height = h;
                ctx.drawImage(originalImage, 0, 0, w, h);
                let q = (qMin + qMax) / 2;
                let mime = (originalMimeType === 'image/png' || originalMimeType === 'image/webp') ? 'image/jpeg' : originalMimeType;

                canvas.toBlob((b) => {
                    if (!b) return;
                    steps++;
                    if (b.size <= targetBytes) {
                        if (!bestBlob || b.size > bestBlob.size) bestBlob = b;
                        qMin = q;
                    } else {
                        qMax = q;
                    }

                    if (steps < 7) {
                        step();
                    } else {
                        if (!bestBlob || bestBlob.size > targetBytes) {
                            w = Math.round(w * 0.8); h = Math.round(h * 0.8);
                            qMin = 0.02; qMax = 0.9; steps = 0;
                            step();
                        } else {
                            finalize(bestBlob, false, `${w} × ${h}`);
                        }
                    }
                }, mime, q);
            }
            step();
        }

        // ⚡ INSTANT SPEED VECTOR COMPRESSION FOR PDF (Takes ~1 Second)
        async function fastCompressPDF() {
            try {
                const targetKB = parseFloat(targetSizeInput.value) || 50;
                const srcDoc = await window.PDFLib.PDFDocument.load(pdfArrayBuffer);
                const originalBytes = pdfArrayBuffer.byteLength;
                
                // Calculate quick ratio to perform vector shrink map instantly
                let currentKB = originalBytes / 1024;
                let scaleFactor = Math.min(0.95, Math.sqrt(targetKB / currentKB));
                if (scaleFactor < 0.25) scaleFactor = 0.25; // Don't let layout break completely

                const outDoc = await window.PDFLib.PDFDocument.create();
                const copiedPages = await outDoc.copyPages(srcDoc, srcDoc.getPageIndices());
                
                copiedPages.forEach(page => {
                    const { width, height } = page.getSize();
                    page.setSize(width * scaleFactor, height * scaleFactor);
                    page.scale(scaleFactor, scaleFactor);
                    outDoc.addPage(page);
                });

                const finalBytes = await outDoc.save({ useObjectStreams: true });
                processedBlob = new Blob([finalBytes], { type: "application/pdf" });

                finalize(processedBlob, true, copiedPages.length + " Pages");
            } catch (err) {
                alert("Error crunching vector maps.");
                resetBtn();
            }
        }

        function finalize(blob, isPdf, res) {
            processedBlob = blob;
            infoFinalSize.textContent = formatBytes(blob.size);
            infoResolution.textContent = res;

            if (isPdf) {
                destPDFIcon.classList.remove('hidden'); destPlaceholder.classList.add('hidden'); destPreview.classList.add('hidden');
            } else {
                destPreview.src = URL.createObjectURL(blob);
                destPreview.classList.remove('hidden'); destPlaceholder.classList.add('hidden'); destPDFIcon.classList.add('hidden');
            }

            downloadBtn.disabled = false;
            downloadBtn.className = "w-full bg-[#00ffcc] text-black font-bold py-3 px-4 rounded-xl flex items-center justify-center text-xs uppercase cursor-pointer transition-all shadow-lg";
            resetBtn();
        }

        downloadBtn.addEventListener('click', () => {
            if (!processedBlob) return;
            const ext = isPDF ? 'pdf' : 'jpg';
            const l = document.createElement('a');
            l.href = URL.createObjectURL(processedBlob);
            l.download = `${originalFileName}_compressed.${ext}`;
            l.click();
        });

        function formatBytes(b) {
            if (b === 0) return '0 Bytes';
            const k = 1024;
            const s = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(b) / Math.log(k));
            return parseFloat((b / Math.pow(k, i)).toFixed(2)) + ' ' + s[i];
        }
    </script>
</body>
</html>
