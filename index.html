<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Resize Image - Fast Exact KB Compressor</title>
    <!-- Tailwind CSS for high contrast UI layout -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #e50914; /* Pure Crimson Red Background */
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; /* Hard restriction on page scroll */
        }
        /* Continuous premium logo scaling heartbeat */
        @keyframes custom-pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.9)); }
        }
        /* Text glow effect for the main heading */
        @keyframes text-glow {
            0%, 100% { text-shadow: 0 0 10px rgba(255, 255, 255, 0.4); }
            50% { text-shadow: 0 0 20px rgba(255, 255, 255, 0.9); }
        }
        .animate-logo {
            animation: custom-pulse 2s infinite ease-in-out;
        }
        .animate-text-glow {
            animation: text-glow 2.5s infinite ease-in-out;
        }
        .glow-border:focus {
            border-color: #e50914;
            box-shadow: 0 0 8px rgba(229, 9, 20, 0.5);
        }
        .white-btn {
            background: #ffffff;
            color: #e50914;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .white-btn:hover {
            background: #f4f4f5;
            transform: translateY(-0.5px);
        }
    </style>
</head>
<body class="text-zinc-100 flex items-center justify-center p-3 md:p-4 h-screen w-screen selection:bg-red-600 selection:text-white">

    <!-- Main Card Container: Fixed Deep Matte Charcoal Card on Red Background -->
    <div class="w-full max-w-lg bg-[#121214] border border-white/10 rounded-3xl p-4 md:p-5 shadow-2xl h-full max-h-[96vh] flex flex-col justify-between overflow-hidden">
        
        <!-- Header Block -->
        <div class="text-center flex flex-col items-center gap-1.5">
            <div class="bg-white text-[#e50914] p-2.5 rounded-xl shadow-md animate-logo flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a8 8 0 0 0-8 8v12l3-2.5 3 2.5 3-2.5 3 2.5 3-2.5 3 2.5V10a8 8 0 0 0-8-8z" />
                    <circle cx="9" cy="10" r="1" fill="currentColor"/>
                    <circle cx="15" cy="10" r="1" fill="currentColor"/>
                    <path d="M12 14a1.5 1.5 0 0 1-1.5-1.5h3A1.5 1.5 0 0 1 12 14z" fill="currentColor"/>
                </svg>
            </div>
            <h1 class="text-2xl font-black tracking-wider uppercase font-mono text-white animate-text-glow">
                Ghost Resize Image
            </h1>
            <p class="text-[9px] tracking-widest text-zinc-400 uppercase font-bold flex items-center gap-1">
                <span class="text-[#e50914]">◆</span> Fast & Strict Exact KB Compressor <span class="text-[#e50914]">◆</span>
            </p>
        </div>

        <!-- Box Area: High Contrast Drag & Drop Input -->
        <div id="dropZone" class="border border-dashed border-zinc-700 bg-zinc-900/60 rounded-xl p-4 text-center cursor-pointer hover:border-[#e50914]/80 hover:bg-zinc-900 transition-all duration-300 flex flex-col items-center justify-center gap-2 group relative my-2 flex-grow max-h-[130px]">
            <input type="file" id="fileInput" accept="image/jpeg, image/png, image/webp, application/pdf" class="hidden">
            <div class="text-zinc-400 opacity-80 group-hover:text-white group-hover:scale-110 transition-all duration-300">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" /></svg>
            </div>
            <p class="text-xs font-semibold text-zinc-300">Drag & Drop File Here</p>
            <button type="button" onclick="document.getElementById('fileInput').click()" class="bg-[#e50914] text-white px-3.5 py-1 rounded-md text-[11px] font-bold shadow-md hover:bg-red-700 transition-all cursor-pointer">
                Choose File
            </button>
        </div>

        <!-- Previews Matrix View -->
        <div class="grid grid-cols-2 gap-3 items-center my-1.5 max-h-[100px]">
            <!-- Original -->
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-2 text-center h-22 flex flex-col items-center justify-center relative overflow-hidden">
                <span class="absolute top-1 left-2 text-[8px] font-bold text-zinc-500 uppercase tracking-wider">Original</span>
                <img id="origPreview" class="max-h-14 max-w-full rounded hidden object-contain shadow-sm">
                <div id="origPDFIcon" class="hidden text-zinc-400 flex flex-col items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/></svg>
                    <p id="origPDFName" class="text-[8px] max-w-[90px] truncate mt-0.5 opacity-70"></p>
                </div>
                <p id="origPlaceholder" class="text-[9px] text-zinc-600 font-mono">Empty</p>
            </div>

            <!-- Preview Output -->
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-2 text-center h-22 flex flex-col items-center justify-center relative overflow-hidden">
                <span class="absolute top-1 left-2 text-[8px] font-bold text-zinc-500 uppercase tracking-wider">Preview</span>
                <img id="destPreview" class="max-h-14 max-w-full rounded hidden object-contain shadow-sm">
                <div id="destPDFIcon" class="hidden text-[#e50914] flex flex-col items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/></svg>
                    <p class="text-[8px] mt-0.5 opacity-80 font-bold">Ready</p>
                </div>
                <p id="destPlaceholder" class="text-[9px] text-zinc-600 font-mono">Unprocessed</p>
            </div>
        </div>

        <!-- Parameters Layout Structure Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 my-1.5">
            <!-- Parameter 1 -->
            <div class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl flex flex-col justify-between">
                <h3 class="text-[9px] font-bold tracking-wider text-[#e50914] uppercase mb-1">1. Dimensions (Optional)</h3>
                <div class="grid grid-cols-2 gap-2 mb-1">
                    <div>
                        <label id="widthLabel" class="block text-[8px] uppercase tracking-wider text-zinc-500 mb-0.5">Width (px)</label>
                        <input type="number" id="widthInput" class="w-full bg-zinc-800 border border-zinc-700 rounded-md px-2 py-0.5 text-xs text-white outline-none glow-border font-mono">
                    </div>
                    <div>
                        <label id="heightLabel" class="block text-[8px] uppercase tracking-wider text-zinc-500 mb-0.5">Height (px)</label>
                        <input type="number" id="heightInput" class="w-full bg-zinc-800 border border-zinc-700 rounded-md px-2 py-0.5 text-xs text-white outline-none glow-border font-mono">
                    </div>
                </div>
                <label id="aspectRatioContainer" class="inline-flex items-center gap-1 text-[9px] text-zinc-400 cursor-pointer select-none">
                    <input type="checkbox" id="aspectRatio" checked class="accent-[#e50914]"> Lock Ratio
                </label>
            </div>

            <!-- Parameter 2 -->
            <div class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl flex flex-col justify-between">
                <h3 class="text-[9px] font-bold tracking-wider text-[#e50914] uppercase mb-1">2. Target Configuration</h3>
                <div class="grid grid-cols-5 gap-1.5 mb-1">
                    <div class="col-span-2">
                        <label class="block text-[8px] uppercase tracking-wider text-zinc-500 mb-0.5">Type</label>
                        <select id="compressionType" class="w-full bg-zinc-800 border border-zinc-700 rounded-md px-1 py-0.5 text-xs text-zinc-300 outline-none cursor-pointer"><option>Strict KB</option></select>
                    </div>
                    <div class="col-span-3">
                        <label class="block text-[8px] uppercase tracking-wider text-zinc-500 mb-0.5">Value</label>
                        <input type="number" id="targetSize" value="50" class="w-full bg-zinc-800 border border-zinc-700 rounded-md px-2 py-0.5 text-xs text-white outline-none glow-border font-mono">
                    </div>
                </div>
                <div class="flex items-center gap-3 text-[9px] text-zinc-300 font-semibold">
                    <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="unit" value="KB" checked class="accent-[#e50914]"> KB</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="unit" value="MB" class="accent-[#e50914]"> MB</label>
                </div>
            </div>
        </div>

        <!-- Primary Action CTA Button -->
        <button id="processBtn" class="w-full white-btn font-black py-2.5 px-4 rounded-xl flex items-center justify-center text-xs tracking-widest uppercase active:scale-[0.99] transition-all cursor-pointer my-1">
            Resize & Compress Instantly
        </button>

        <!-- Metric Output Analytics Feed Tracker -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-2 my-1">
            <div class="grid grid-cols-3 gap-1.5 text-center mb-1.5">
                <div class="bg-zinc-800/40 p-1 rounded-lg border border-zinc-800"><p class="text-[7px] text-zinc-500 uppercase mb-0.5">Original</p><span id="infoOrigSize" class="text-xs font-semibold font-mono text-zinc-300">-</span></div>
                <div class="bg-zinc-800/40 p-1 rounded-lg border border-zinc-800"><p class="text-[7px] text-zinc-500 uppercase mb-0.5">Final Size</p><span id="infoFinalSize" class="text-xs font-bold font-mono text-white">-</span></div>
                <div class="bg-zinc-800/40 p-1 rounded-lg border border-zinc-800"><p id="resTypeLabel" class="text-[7px] text-zinc-500 uppercase mb-0.5">Resolution</p><span id="infoResolution" class="text-xs font-semibold font-mono text-zinc-300">-</span></div>
            </div>
            <div class="flex justify-between text-[7px] font-bold uppercase tracking-wider text-zinc-400 mb-0.5">
                <span>Accuracy Target Tracker</span> <span id="qualityVal" class="font-mono text-white">0%</span>
            </div>
            <div class="w-full bg-zinc-800 h-1 rounded-full overflow-hidden">
                <div id="qualityBar" class="bg-white h-full w-0 transition-all duration-300"></div>
            </div>
        </div>

        <!-- Process Download System Activation Pin -->
        <button id="downloadBtn" disabled class="w-full bg-transparent border border-zinc-800 text-zinc-600 font-bold py-2.5 px-4 rounded-xl flex items-center justify-center text-xs tracking-wider uppercase transition-all cursor-not-allowed">
            Download Processed File
        </button>

        <!-- Footer Layer Branding -->
        <div class="text-center pt-1.5 border-t border-zinc-900 text-[8px] text-zinc-600 tracking-wider">
            Created By <span>Ghost Hacker (AltafxRaja)</span>
        </div>
    </div>

    <!-- Script Internal Logical Control Setup Framework -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script>
        let isPDF = false, pdfArrayBuffer = null, originalImage = null;
        let originalFileName = 'ghost_asset', originalMimeType = '', originalAspectRatio = 1, processedBlob = null;

        const fileInput = document.getElementById('fileInput'), dropZone = document.getElementById('dropZone');
        const origPreview = document.getElementById('origPreview'), origPDFIcon = document.getElementById('origPDFIcon'), origPDFName = document.getElementById('origPDFName'), origPlaceholder = document.getElementById('origPlaceholder');
        const destPreview = document.getElementById('destPreview'), destPDFIcon = document.getElementById('destPDFIcon'), destPlaceholder = document.getElementById('destPlaceholder');
        const widthInput = document.getElementById('widthInput'), heightInput = document.getElementById('heightInput');
        const widthLabel = document.getElementById('widthLabel'), heightLabel = document.getElementById('heightLabel');
        const aspectRatioCheck = document.getElementById('aspectRatio'), aspectRatioContainer = document.getElementById('aspectRatioContainer');
        const targetSizeInput = document.getElementById('targetSize'), resTypeLabel = document.getElementById('resTypeLabel');
        const processBtn = document.getElementById('processBtn'), downloadBtn = document.getElementById('downloadBtn');
        const infoOrigSize = document.getElementById('infoOrigSize'), infoFinalSize = document.getElementById('infoFinalSize'), infoResolution = document.getElementById('infoResolution');
        const qualityVal = document.getElementById('qualityVal'), qualityBar = document.getElementById('qualityBar');

        ['dragover', 'dragenter'].forEach(n => dropZone.addEventListener(n, (e) => { e.preventDefault(); dropZone.style.borderColor = '#ffffff'; }));
        ['dragleave', 'drop'].forEach(n => dropZone.addEventListener(n, (e) => { e.preventDefault(); dropZone.style.borderColor = ''; }));
        dropZone.addEventListener('drop', (e) => { if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', (e) => { if(e.target.files.length) handleFile(e.target.files[0]); });

        widthInput.addEventListener('input', () => { if (!isPDF && aspectRatioCheck.checked && originalImage && widthInput.value) heightInput.value = Math.round(widthInput.value / originalAspectRatio); });
        heightInput.addEventListener('input', () => { if (!isPDF && aspectRatioCheck.checked && originalImage && heightInput.value) widthInput.value = Math.round(heightInput.value * originalAspectRatio); });

        function handleFile(file) {
            originalFileName = file.name.split('.').slice(0, -1).join('.');
            originalMimeType = file.type;
            infoOrigSize.textContent = formatBytes(file.size);
            clearState();

            if (file.type === "application/pdf" || file.name.endsWith('.pdf')) {
                isPDF = true;
                aspectRatioContainer.classList.add('hidden');
                widthLabel.textContent = "Scale X (%)"; heightLabel.textContent = "Scale Y (%)";
                widthInput.value = "100"; heightInput.value = "100";
                resTypeLabel.textContent = "Pages";
                origPDFName.textContent = file.name;
                origPDFIcon.classList.remove('hidden'); origPlaceholder.classList.add('hidden');
                downloadBtn.textContent = "Download PDF";
            } else {
                isPDF = false;
                aspectRatioContainer.classList.remove('hidden');
                widthLabel.textContent = "Width (px)"; heightLabel.textContent = "Height (px)";
                resTypeLabel.textContent = "Resolution";
                downloadBtn.textContent = "Download Image";

                const r = new FileReader();
                r.onload = (e) => {
                    originalImage = new Image();
                    originalImage.onload = () => {
                        originalAspectRatio = originalImage.width / originalImage.height;
                        widthInput.value = originalImage.width; heightInput.value = originalImage.height;
                        infoResolution.textContent = `${originalImage.width} × ${originalImage.height}`;
                        origPreview.src = e.target.result;
                        origPreview.classList.remove('hidden'); origPlaceholder.classList.add('hidden');
                    };
                    originalImage.src = e.target.result;
                };
                r.readAsDataURL(file);
            }
        }

        function clearState() {
            origPreview.classList.add('hidden'); origPDFIcon.classList.add('hidden'); origPlaceholder.classList.remove('hidden');
            destPreview.classList.add('hidden'); destPDFIcon.classList.add('hidden'); destPlaceholder.classList.remove('hidden');
            downloadBtn.disabled = true;
            qualityVal.textContent = "0%"; qualityBar.style.width = "0%";
            downloadBtn.className = "w-full bg-transparent border border-zinc-800 text-zinc-600 font-bold py-2.5 px-4 rounded-xl flex items-center justify-center text-xs tracking-wider uppercase cursor-not-allowed";
        }

        processBtn.addEventListener('click', async () => {
            processBtn.textContent = "Processing... Plz Wait";
            processBtn.disabled = true;
            setTimeout(async () => {
                if (isPDF && fileInput.files[0]) await runFastPdfCompress();
                else if (!isPDF && originalImage) runFastImageCompress();
                else { alert("Please upload a file first."); resetBtn(); }
            }, 50);
        });

        function resetBtn() {
            processBtn.textContent = "Resize & Compress Instantly";
            processBtn.disabled = false;
        }

        function runFastImageCompress() {
            let currentWidth = parseInt(widthInput.value) || originalImage.width;
            let currentHeight = parseInt(heightInput.value) || originalImage.height;
            const unit = document.querySelector('input[name="unit"]:checked').value;
            let targetSizeBytes = (parseFloat(targetSizeInput.value) || 50) * 1024;
            if (unit === 'MB') targetSizeBytes *= 1024;

            const canvas = document.createElement('canvas');
            let ctx = canvas.getContext('2d');
            let minQuality = 0.02, maxQuality = 0.98, optimalBlob = null, loopCounter = 0;

            function executeBinarySearch() {
                canvas.width = currentWidth; canvas.height = currentHeight;
                ctx.drawImage(originalImage, 0, 0, currentWidth, currentHeight);
                let testQuality = (minQuality + maxQuality) / 2;
                let exportMime = (originalMimeType === 'image/png' || originalMimeType === 'image/webp') ? 'image/jpeg' : originalMimeType;

                canvas.toBlob((blob) => {
                    if (!blob) return;
                    loopCounter++;
                    if (blob.size <= targetSizeBytes) {
                        if (!optimalBlob || blob.size > optimalBlob.size) optimalBlob = blob;
                        minQuality = testQuality;
                    } else {
                        maxQuality = testQuality;
                    }

                    if (loopCounter < 7) {
                        executeBinarySearch();
                    } else {
                        if (!optimalBlob || optimalBlob.size > targetSizeBytes) {
                            currentWidth = Math.round(currentWidth * 0.8);
                            currentHeight = Math.round(currentHeight * 0.8);
                            minQuality = 0.02; maxQuality = 0.9; loopCounter = 0;
                            executeBinarySearch();
                        } else {
                            finalizeAsset(optimalBlob, false, `${currentWidth} × ${currentHeight}`);
                        }
                    }
                }, exportMime, testQuality);
            }
            executeBinarySearch();
        }

        async function runFastPdfCompress() {
            try {
                const targetSizeKB = parseFloat(targetSizeInput.value) || 50;
                const file = fileInput.files[0];
                const arrayBuffer = await file.arrayBuffer();
                const srcDoc = await window.PDFLib.PDFDocument.load(arrayBuffer);
                const currentKB = file.size / 1024;
                
                let scaleFactor = Math.min(0.95, Math.sqrt(targetSizeKB / currentKB));
                if (scaleFactor < 0.25) scaleFactor = 0.25; 

                const outDoc = await window.PDFLib.PDFDocument.create();
                const copiedPages = await outDoc.copyPages(srcDoc, srcDoc.getPageIndices());
                
                copiedPages.forEach(page => {
                    const { width, height } = page.getSize();
                    page.setSize(width * scaleFactor, height * scaleFactor);
                    page.scale(scaleFactor, scaleFactor);
                    outDoc.addPage(page);
                });

                const finalBytes = await outDoc.save({ useObjectStreams: true });
                processedBlob = new Blob([finalBytes], { type: "application/pdf" });

                finalizeAsset(processedBlob, true, copiedPages.length + " Pages");
            } catch (err) {
                alert("Error optimizing PDF structure.");
                resetBtn();
            }
        }

        function finalizeAsset(blob, isPdfAsset, resText) {
            processedBlob = blob;
            infoFinalSize.textContent = formatBytes(blob.size);
            infoResolution.textContent = resText;
            qualityVal.textContent = "100% Target Met";
            qualityBar.style.width = "100__";

            if (isPdfAsset) {
                destPDFIcon.classList.remove('hidden'); destPlaceholder.classList.add('hidden'); destPreview.classList.add('hidden');
            } else {
                destPreview.src = URL.createObjectURL(blob);
                destPreview.classList.remove('hidden'); destPlaceholder.classList.add('hidden'); destPDFIcon.classList.add('hidden');
            }
            
            downloadBtn.disabled = false;
            downloadBtn.className = "w-full bg-white text-[#e50914] font-black py-2.5 px-4 rounded-xl flex items-center justify-center text-xs tracking-wider uppercase transition-all shadow-md cursor-pointer hover:bg-zinc-100";
            resetBtn();
        }

        downloadBtn.addEventListener('click', () => {
            if (!processedBlob) return;
            const ext = isPDF ? 'pdf' : 'jpg';
            const l = document.createElement('a');
            l.href = URL.createObjectURL(processedBlob);
            l.download = `${originalFileName}_exact_${targetSizeInput.value}kb.${ext}`;
            l.click();
        });

        function formatBytes(b) {
            if (b === 0) return '0 Bytes';
            const k = 1024;
            const s = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(b) / Math.log(k));
            return parseFloat((b / Math.pow(k, i)).toFixed(2)) + ' ' + s[i];
        }
    </script>
</body>
</html>
