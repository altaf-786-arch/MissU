<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISS YOU</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{
min-height:100vh;
background:linear-gradient(-45deg,#ff006e,#8338ec,#3a86ff,#06ffa5);
background-size:400% 400%;
animation:bg 12s ease infinite;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}
@keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.card{
width:100%;max-width:750px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.2);
border-radius:30px;
padding:30px;
text-align:center;
color:#fff;
box-shadow:0 15px 50px rgba(0,0,0,.25);
z-index:2;
}
.title{
font-size:4rem;font-weight:900;
background:linear-gradient(90deg,#ff006e,#ffbe0b,#06ffa5,#3a86ff,#8338ec,#ff006e);
background-size:400%;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:rainbow 8s linear infinite;
margin-bottom:15px;
}
@keyframes rainbow{100%{background-position:400%}}
.subtitle{opacity:.9;margin-bottom:20px}
.input-group{position:relative;margin:15px 0}
input,textarea{
width:100%;padding:16px;
border:none;border-radius:18px;
background:rgba(255,255,255,.18);
color:#fff;font-size:16px;
outline:none;
}
input::placeholder,textarea::placeholder{color:#eee}
.btn{
padding:14px 28px;
border:none;border-radius:50px;
background:linear-gradient(45deg,#ff006e,#ff4d6d);
color:white;font-weight:700;
cursor:pointer;
box-shadow:0 0 25px rgba(255,0,110,.5);
}
#viewer{display:none}
#person{font-size:2rem;margin:15px 0}
#typed{font-size:1.2rem;line-height:1.8}
.footer{
margin-top:20px;
font-size:14px;
opacity:.95;
}
.footer span{
font-weight:700;
background:linear-gradient(90deg,#ff006e,#ffbe0b,#06ffa5,#3a86ff);
background-size:400%;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:rainbow 8s linear infinite;
}
.float{
position:fixed;
pointer-events:none;
animation:up linear forwards;
}
@keyframes up{
from{transform:translateY(0);opacity:1}
to{transform:translateY(-120vh);opacity:0}
}
</style>
</head>
<body>

<div class="card">
<div id="creator">
<h1 class="title">MISS YOU</h1>
<p class="subtitle">Create a beautiful message ❤️</p>

<div class="input-group">
<input id="name" placeholder="✨ Enter Special Name">
</div>

<div class="input-group">
<textarea id="msg" rows="5" placeholder="💌 Write your heartfelt message"></textarea>
</div>

<button class="btn" onclick="generateLink()">🔗 Generate Premium Link</button>
<div id="result"></div>

<div class="footer">Created With ❤️ By <span>Hacker Altaf</span></div>
</div>

<div id="viewer">
<h1 class="title">MISS YOU</h1>
<h2 id="person"></h2>
<p id="typed"></p>
<div class="footer">Created With ❤️ By <span>Hacker Altaf</span></div>
</div>
</div>

<script>
function make(sym){
let e=document.createElement("div");
e.className="float";
e.innerHTML=sym;
e.style.left=Math.random()*100+"vw";
e.style.bottom="-30px";
e.style.fontSize=(15+Math.random()*25)+"px";
e.style.animationDuration=(5+Math.random()*5)+"s";
document.body.appendChild(e);
setTimeout(()=>e.remove(),10000);
}
setInterval(()=>make("❤️"),500);
setInterval(()=>make("✨"),900);
setInterval(()=>make("🌹"),1300);

function generateLink(){
let n=document.getElementById('name').value.trim();
let m=document.getElementById('msg').value.trim();
if(!n||!m){alert('Enter name and message');return;}
let data=btoa(JSON.stringify({n:n,m:m}));
let link=location.href.split('?')[0]+'?d='+data;
document.getElementById('result').innerHTML=
'<br><input id="linkBox" value="'+link+'" readonly><br><br>'+
'<button class="btn" onclick="copyLink()">📋 Copy Link</button>';
}
function copyLink(){
navigator.clipboard.writeText(document.getElementById('linkBox').value);
alert('❤️ Link Copied');
}

const p=new URLSearchParams(location.search);
if(p.has('d')){
document.getElementById('creator').style.display='none';
document.getElementById('viewer').style.display='block';
let d=JSON.parse(atob(p.get('d')));
document.getElementById('person').innerHTML='💖 '+d.n+' 💖';
let i=0,msg=d.m;
(function type(){
if(i<msg.length){
document.getElementById('typed').innerHTML+=msg.charAt(i);
i++;setTimeout(type,35);
}
})();
}
</script>
</body>
</html>
