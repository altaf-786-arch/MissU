<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Resize Image</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#050505;
color:#fff;
min-height:100vh;
overflow-x:hidden;
}

body::before{
content:'';
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at center,
rgba(0,255,170,.08),
transparent 70%);
animation:ghost 5s infinite alternate;
z-index:-1;
}

@keyframes ghost{
from{transform:scale(1);}
to{transform:scale(1.2);}
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.logo{
text-align:center;
font-size:42px;
font-weight:bold;
margin-top:20px;
color:#00ffb3;
text-shadow:0 0 20px #00ffb3;
}

.subtitle{
text-align:center;
opacity:.7;
margin-bottom:30px;
}

.card{
background:#0d0d0d;
border:1px solid #1f1f1f;
border-radius:20px;
padding:25px;
box-shadow:0 0 20px rgba(0,255,170,.15);
}

.upload-box{
border:2px dashed #00ffb3;
padding:40px;
border-radius:15px;
text-align:center;
cursor:pointer;
margin-bottom:20px;
}

.upload-box:hover{
background:#111;
}

input[type=file]{
display:none;
}

.preview{
width:100%;
margin-top:20px;
display:none;
border-radius:15px;
}

.row{
display:flex;
gap:10px;
margin-top:15px;
flex-wrap:wrap;
}

.row input,
.row select{
flex:1;
padding:12px;
background:#111;
color:white;
border:none;
border-radius:10px;
}

.btn{
width:100%;
padding:14px;
margin-top:15px;
background:#00ffb3;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.btn:hover{
opacity:.9;
}

.download{
display:none;
text-decoration:none;
color:black;
background:#00ffb3;
padding:12px 20px;
border-radius:10px;
font-weight:bold;
margin-top:15px;
display:inline-block;
}

.info{
margin-top:15px;
opacity:.8;
}

footer{
text-align:center;
margin-top:30px;
padding:20px;
opacity:.7;
font-size:14px;
}

.glow{
color:#00ffb3;
text-shadow:0 0 15px #00ffb3;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">👻 Ghost Resize Image</div>

<div class="subtitle">
Resize & Compress Images Like a Ghost
</div>

<div class="card">

<label class="upload-box" for="imageInput">
📤 Click Here To Upload Image
</label>

<input type="file" id="imageInput" accept="image/*">

<img id="preview" class="preview">

<div class="row">
<input
type="number"
id="width"
placeholder="Width (px)">
<input
type="number"
id="height"
placeholder="Height (px)">
</div>

<div class="row">

<select id="sizeType">

<option value="kb">
Target Size (KB)
</option>

<option value="mb">
Target Size (MB)
</option>

</select>

<input
type="number"
id="targetSize"
placeholder="Enter Size">

</div>

<button
class="btn"
onclick="processImage()">

⚡ Resize & Compress

</button>

<div class="info" id="info">
No image selected
</div>

<a
id="downloadBtn"
class="download">

⬇ Download Image

</a>

</div>

<footer>
Created By
<span class="glow">
Ghost Hacker (AltafxRaja)
</span>
</footer>

</div>

<script>

let selectedFile = null;

const imageInput =
document.getElementById("imageInput");

const preview =
document.getElementById("preview");

imageInput.addEventListener(
"change",
function(e){

selectedFile =
e.target.files[0];

if(!selectedFile) return;

preview.src =
URL.createObjectURL(selectedFile);

preview.style.display = "block";

document.getElementById("info")
.innerHTML =
"Original Size: " +
(selectedFile.size/1024)
.toFixed(2) +
" KB";

});

function bytesToKB(bytes){
return bytes/1024;
}

function bytesToMB(bytes){
return bytes/1024/1024;
}

async function processImage(){

if(!selectedFile){
alert("Please Upload Image");
return;
}

const widthInput =
parseInt(
document.getElementById("width").value
);

const heightInput =
parseInt(
document.getElementById("height").value
);

const sizeType =
document.getElementById("sizeType").value;

const targetValue =
parseFloat(
document.getElementById("targetSize").value
);

const img = new Image();

img.onload = async function(){

const canvas =
document.createElement("canvas");

const newWidth =
widthInput || img.width;

const newHeight =
heightInput || img.height;

canvas.width = newWidth;
canvas.height = newHeight;

const ctx =
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
newWidth,
newHeight
);

let targetBytes = 0;

if(targetValue){

if(sizeType === "kb"){
targetBytes =
targetValue * 1024;
}else{
targetBytes =
targetValue * 1024 * 1024;
}

}

let quality = 0.95;
let blob;

while(quality > 0.05){

blob =
await new Promise(resolve =>
canvas.toBlob(
resolve,
"image/jpeg",
quality
)
);

if(
targetBytes === 0 ||
blob.size <= targetBytes
){
break;
}

quality -= 0.05;

}

preview.src =
URL.createObjectURL(blob);

const finalKB =
(blob.size / 1024)
.toFixed(2);

const finalMB =
(blob.size / 1024 / 1024)
.toFixed(2);

document.getElementById("info")
.innerHTML =

"✅ Final Size: " +
finalKB +
" KB (" +
finalMB +
" MB)<br>" +

"📐 Resolution: " +
newWidth +
" × " +
newHeight +

"<br>🎯 Quality: " +
Math.round(
quality * 100
) + "%";

const downloadBtn =
document.getElementById(
"downloadBtn"
);

downloadBtn.href =
URL.createObjectURL(blob);

downloadBtn.download =
"ghost-resized-image.jpg";

downloadBtn.style.display =
"inline-block";

};

img.src =
URL.createObjectURL(selectedFile);

}

</script>

</body>
</html>
